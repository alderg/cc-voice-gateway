y="214" width="208" height="44" stroke-width="0" style="fill: rgb(18, 18, 18);"/><text x="640" y="226">optional, after 10 min with no voice call:</text><text x="640" y="240">questions · approvals</text><text x="640" y="254">and the kill switch alarm; /stop locks</text></g></g></g><g data-cell-id="e8"><g><path d="M 200 688 L 200 657.18" fill="none" stroke="#475569" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(155, 167, 184);"/><path d="M 200 649.68 L 203.75 657.18 L 196.25 657.18 Z" fill="#475569" stroke="#475569" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(155, 167, 184); stroke: rgb(155, 167, 184);"/></g><g><g fill="#334155" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(172, 184, 201);"><rect fill="#F8FAFC" stroke="none" x="214" y="662" width="78" height="15" stroke-width="0" style="fill: rgb(21, 23, 25);"/><text x="252" y="673">starts, restarts</text></g></g></g></g></g></g></svg>