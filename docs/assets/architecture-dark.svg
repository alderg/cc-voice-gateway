<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="842px" height="913px" viewBox="0 0 842 913"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="0" y="0" width="840" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#0F172A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="20px" style="fill: rgb(211, 218, 234);"><text x="2" y="24">Voice gateway: architecture</text></g></g></g><g data-cell-id="car"><g transform="translate(0.5,0.5)"><path d="M 400 66 L 400 46 Q 400 40 394 40 L 6 40 Q 0 40 0 46 L 0 66" fill="#fff7ed" stroke="#fb923c" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(30, 23, 15); stroke: rgb(175, 84, 10);"/><path d="M 0 66 L 0 154 Q 0 160 6 160 L 394 160 Q 400 160 400 154 L 400 66" fill="#fffbf5" stroke="#fb923c" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(23, 20, 15); stroke: rgb(175, 84, 10);"/><path d="M 0 66 L 400 66" fill="none" stroke="#fb923c" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(175, 84, 10);"/></g><g><g fill="#334155" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(172, 184, 201);"><text x="200" y="59">Claude app · phone, desktop or CarPlay</text></g></g><g data-cell-id="voice"><g transform="translate(0.5,0.5)"><rect x="40" y="82" width="320" height="60" rx="6" ry="6" fill="#fff7ed" stroke="#fb923c" pointer-events="all" style="fill: rgb(30, 23, 15); stroke: rgb(175, 84, 10);"/></g><g><g fill="#1E293B" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(195, 204, 220);"><text x="200" y="106">Voice AI</text></g></g><g data-cell-id="voice-sub"><g><rect x="40" y="108.7" width="320" height="26.4" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#64748B" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(126, 140, 159);"><text x="200" y="123.7">Claude voice mode</text><text x="200" y="136.7">with a custom connector (MCP)</text></g></g></g></g></g><g data-cell-id="telegram"><g transform="translate(0.5,0.5)"><path d="M 840 66 L 840 46 Q 840 40 834 40 L 446 40 Q 440 40 440 46 L 440 66" fill="#fff7ed" stroke="#fb923c" stroke-miterlimit="10" stroke-dasharray="6 4" pointer-events="all" style="fill: rgb(30, 23, 15); stroke: rgb(175, 84, 10);"/><path d="M 440 66 L 440 154 Q 440 160 446 160 L 834 160 Q 840 160 840 154 L 840 66" fill="#fffbf5" stroke="#fb923c" stroke-miterlimit="10" stroke-dasharray="6 4" pointer-events="all" style="fill: rgb(23, 20, 15); stroke: rgb(175, 84, 10);"/><path d="M 440 66 L 840 66" fill="none" stroke="#fb923c" stroke-miterlimit="10" stroke-dasharray="6 4" pointer-events="all" style="stroke: rgb(175, 84, 10);"/></g><g><g fill="#334155" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(172, 184, 201);"><text x="640" y="59">Telegram · optional</text></g></g><g data-cell-id="chat"><g transform="translate(0.5,0.5)"><rect x="480" y="82" width="320" height="60" rx="6" ry="6" fill="#fff7ed" stroke="#fb923c" stroke-dasharray="6 4" pointer-events="all" style="fill: rgb(30, 23, 15); stroke: rgb(175, 84, 10);"/></g><g><g fill="#1E293B" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(195, 204, 220);"><text x="640" y="106">Chat with your bot</text></g></g><g data-cell-id="chat-sub"><g><rect x="480" y="108.7" width="320" height="26.4" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#64748B" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(126, 140, 159);"><text x="640" y="123.7">Bot API sendMessage to your chat ID</text><text x="640" y="136.7">push notification on your phone</text></g></g></g></g></g><g data-cell-id="tunnel"><g transform="translate(0.5,0.5)"><rect x="40" y="210" width="320" height="56" rx="6" ry="6" fill="#f8fafc" stroke="#cbd5e1" pointer-events="all" style="fill: rgb(21, 23, 25); stroke: rgb(47, 56, 66);"/></g><g><g fill="#1E293B" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(195, 204, 220);"><text x="200" y="239">Public HTTPS address</text></g></g><g data-cell-id="tunnel-sub"><g><rect x="40" y="241.3" width="320" height="13.2" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#64748B" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(126, 140, 159);"><text x="200" y="256.3">Tailscale Funnel, tunnel or reverse proxy · https://&lt;host&gt;/mcp</text></g></g></g></g><g data-cell-id="machine"><g transform="translate(0.5,0.5)"><path d="M 840 336 L 840 316 Q 840 310 834 310 L 6 310 Q 0 310 0 316 L 0 336" fill="#f8fafc" stroke="#cbd5e1" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(21, 23, 25); stroke: rgb(47, 56, 66);"/><path d="M 0 336 L 0 870 Q 0 876 6 876 L 834 876 Q 840 876 840 870 L 840 336" fill="#f8fafc" stroke="#cbd5e1" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(21, 23, 25); stroke: rgb(47, 56, 66);"/><path d="M 0 336 L 840 336" fill="none" stroke="#cbd5e1" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(47, 56, 66);"/></g><g><g fill="#334155" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(172, 184, 201);"><text x="420" y="329">Your computer · Mac or Linux, always on (tmux)</text></g></g><g data-cell-id="gateway"><g transform="translate(0.5,0.5)"><rect x="40" y="366" width="320" height="64" rx="6" ry="6" fill="#f5f3ff" stroke="#a78bfa" pointer-events="all" style="fill: rgb(28, 26, 36); stroke: rgb(118, 94, 190);"/></g><g><g fill="#1E293B" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(195, 204, 220);"><text x="200" y="392">Gateway · src/gateway.mjs</text></g></g><g data-cell-id="gateway-sub"><g><rect x="40" y="394.7" width="320" height="26.4" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#64748B" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(126, 140, 159);"><text x="200" y="409.7">HTTP MCP 127.0.0.1:8787 + channel (stdio) · no AI:</text><text x="200" y="422.7">keeps state, relays, watches pull requests</text></g></g></g></g><g data-cell-id="controller"><g transform="translate(0.5,0.5)"><rect x="40" y="584" width="320" height="64" rx="6" ry="6" fill="#eff6ff" stroke="#60a5fa" pointer-events="all" style="fill: rgb(21, 27, 35); stroke: rgb(50, 110, 183);"/></g><g><g fill="#1E293B" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(195, 204, 220);"><text x="200" y="610">Controller session · Claude Code</text></g></g><g data-cell-id="controller-sub"><g><rect x="40" y="612.7" width="320" height="26.4" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#64748B" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(126, 140, 159);"><text x="200" y="627.7">channel: plugin voice@cc-voice-gateway, or the</text><text x="200" y="640.7">development flag · answers briefly, asks back</text></g></g></g></g><g data-cell-id="tools"><g transform="translate(0.5,0.5)"><path d="M 440 406 L 798 406 L 810 418 L 810 547 L 440 547 L 440 406 Z" fill="#fefce8" stroke="#eab308" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(23, 22, 4); stroke: rgb(131, 84, 0);"/><path d="M 798 406 L 798 418 L 810 418" fill="none" stroke="#eab308" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(131, 84, 0);"/></g><g><g fill="#1E293B" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(195, 204, 220);"><text x="450" y="428">Tools for the voice AI:</text><text x="450" y="442">status · send · ask · get_reply · approve · emergency_stop</text><text x="450" y="456">Tools for the controller:</text><text x="450" y="470">reply · list_workers · dispatch · worker_status</text><text x="450" y="484">stop_worker · raise_alarm · restart_controller</text><text x="450" y="498">above the level confined: clone_repo · delete_path</text><text x="450" y="512">read-only gh; gh pr merge only after your approval</text><text x="450" y="526">Rare approvals go through the permission relay</text></g></g></g><g data-cell-id="workers"><g transform="translate(0.5,0.5)"><path d="M 810 580 L 810 560 Q 810 554 804 554 L 446 554 Q 440 554 440 560 L 440 580" fill="#eff6ff" stroke="#60a5fa" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(21, 27, 35); stroke: rgb(50, 110, 183);"/><path d="M 440 580 L 440 672 Q 440 678 446 678 L 804 678 Q 810 678 810 672 L 810 580" fill="#f7faff" stroke="#60a5fa" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(20, 23, 27); stroke: rgb(50, 110, 183);"/><path d="M 440 580 L 810 580" fill="none" stroke="#60a5fa" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(50, 110, 183);"/></g><g><g fill="#334155" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(172, 184, 201);"><text x="625" y="573">Workers · claude -p per repository</text></g></g><g data-cell-id="wa"><g transform="translate(0.5,0.5)"><rect x="460" y="594" width="160" height="44" rx="6" ry="6" fill="#eff6ff" stroke="#60a5fa" pointer-events="all" style="fill: rgb(21, 27, 35); stroke: rgb(50, 110, 183);"/></g><g><g fill="#1E293B" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(195, 204, 220);"><text x="540" y="622">Worker A</text></g></g></g><g data-cell-id="wb"><g transform="translate(0.5,0.5)"><rect x="635" y="594" width="160" height="44" rx="6" ry="6" fill="#eff6ff" stroke="#60a5fa" pointer-events="all" style="fill: rgb(21, 27, 35); stroke: rgb(50, 110, 183);"/></g><g><g fill="#1E293B" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(195, 204, 220);"><text x="715" y="622">Worker B</text></g></g></g><g data-cell-id="wdocker"><g transform="translate(0.5,0.5)"><rect x="460" y="648" width="335" height="22" rx="6" ry="6" fill="none" stroke="#60a5fa" stroke-dasharray="6 4" pointer-events="all" style="stroke: rgb(50, 110, 183);"/></g><g><g fill="#64748B" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(126, 140, 159);"><text x="627.5" y="663.5">optional: in a Docker container, with access levels</text></g></g></g></g><g data-cell-id="watchdog"><g transform="translate(0.5,0.5)"><rect x="40" y="688" width="320" height="64" rx="6" ry="6" fill="#f5f3ff" stroke="#a78bfa" pointer-events="all" style="fill: rgb(28, 26, 36); stroke: rgb(118, 94, 190);"/></g><g><g fill="#1E293B" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(195, 204, 220);"><text x="200" y="714">Watchdog · scripts/start-controller.sh</text></g></g><g data-cell-id="watchdog-sub"><g><rect x="40" y="716.7" width="320" height="26.4" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#64748B" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(126, 140, 159);"><text x="200" y="731.7">restarts the session after a crash, when the gateway</text><text x="200" y="744.7">stops answering, or by voice · backoff, limit, one at a time</text></g></g></g></g><g data-cell-id="setupnote"><g transform="translate(0.5,0.5)"><path d="M 440 694 L 798 694 L 810 706 L 810 758 L 440 758 L 440 694 Z" fill="#fefce8" stroke="#eab308" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(23, 22, 4); stroke: rgb(131, 84, 0);"/><path d="M 798 694 L 798 706 L 810 706" fill="none" stroke="#eab308" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(131, 84, 0);"/></g><g><g fill="#1E293B" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(195, 204, 220);"><text x="450" y="716">Set up with scripts/setup.mjs: settings in</text><text x="450" y="730">.secrets/gateway.env, tokens there as files 0600;</text><text x="450" y="744">models and effort for controller and workers</text></g></g></g><g data-cell-id="kill"><g transform="translate(0.5,0.5)"><rect x="40" y="790" width="770" height="64" rx="6" ry="6" fill="#fef2f2" stroke="#f87171" pointer-events="all" style="fill: rgb(35, 25, 25); stroke: rgb(207, 91, 91);"/></g><g><g fill="#1E293B" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(195, 204, 220);"><text x="425" y="816">Kill switch · in the gateway, src/killswitch.mjs</text></g></g><g data-cell-id="kill-sub"><g><rect x="40" y="818.7" width="770" height="26.4" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#64748B" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(126, 140, 159);"><text x="425" y="833.7">locked by voice (emergency stop), /stop on Telegram, a rule on the workers' runs, or the controller's alarm:</text><text x="425" y="846.7">no new tasks, workers stopped, repositories read-only, alarm. Unlocked only at the server: scripts/unlock.mjs</text></g></g></g></g></g><g data-cell-id="legend"><g><rect x="0" y="888" width="840" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#64748B" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(126, 140, 159);"><text x="2" y="905">Orange: cloud service · purple: own code · blue: Claude Code · red: kill switch</text></g></g></g><g data-cell-id="e1"><g><path d="M 200 142 L 200 200.82" fill="none" stroke="#475569" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(155, 167, 184);"/><path d="M 200 208.32 L 196.25 200.82 L 203.75 200.82 Z" fill="#475569" stroke="#475569" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(155, 167, 184); stroke: rgb(155, 167, 184);"/></g><g><g fill="#334155" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(172, 184, 201);"><rect fill="#FFFFFF" stroke="none" x="224" y="165" width="98" height="30" stroke-width="0" style="fill: rgb(18, 18, 18);"/><text x="272" y="177">MCP over HTTPS</text><text x="272" y="191">(OAuth sign-in)</text></g></g></g><g data-cell-id="e2"><g><path d="M 200 266 L 200 356.82" fill="none" stroke="#475569" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(155, 167, 184);"/><path d="M 200 364.32 L 196.25 356.82 L 203.75 356.82 Z" fill="#475569" stroke="#475569" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(155, 167, 184); stroke: rgb(155, 167, 184);"/></g><g><g fill="#334155" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(172, 184, 201);"><rect fill="#FFFFFF" stroke="none" x="221" y="285" width="84" height="15" stroke-width="0" style="fill: rgb(18, 18, 18);"/><text x="262" y="296">local, port 8787</text></g></g></g><g data-cell-id="e3"><g><path d="M 136 430 L 136 574.82" fill="none" stroke="#475569" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(155, 167, 184);"/><path d="M 136 582.32 L 132.25 574.82 L 139.75 574.82 Z" fill="#475569" stroke="#475569" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(155, 167, 184); stroke: rgb(155, 167, 184);"/></g><g><g fill="#334155" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(172, 184, 201);"><rect fill="#F8FAFC" stroke="none" x="98" y="501" width="77" height="15" stroke-width="0" style="fill: rgb(21, 23, 25);"/><text x="136" y="512">channel event</text></g></g></g><g data-cell-id="e4"><g><path d="M 264 584 L 264 439.18" fill="none" stroke="#475569" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(155, 167, 184);"/><path d="M 264 431.68 L 267.75 439.18 L 260.25 439.18 Z" fill="#475569" stroke="#475569" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(155, 167, 184); stroke: rgb(155, 167, 184);"/></g><g><g fill="#334155" font-family="Helvetica" text-an